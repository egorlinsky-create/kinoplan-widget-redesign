<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>3D-ассеты · Киноплан</title>
<style>
  body{margin:0;background:#0B1220;font-family:Inter,"Segoe UI",sans-serif;color:#fff;padding:32px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .cell{background:linear-gradient(160deg,#14243D,#0D1729);border-radius:24px;padding:16px;text-align:center}
  .cell img{width:100%;display:block}
  .cell span{font-size:13px;opacity:.6}
  .light .cell{background:linear-gradient(160deg,#F4F8FD,#E4EDF8);color:#0F1D33}
  .light{padding-top:24px}
</style></head><body>
<h2 style="font-weight:600;margin:0 0 16px">Тёмный акцент</h2>
<div class="grid">
  <div class="cell"><img src="svg/ticket.svg"><span>ticket</span></div>
  <div class="cell"><img src="svg/seat.svg"><span>seat</span></div>
  <div class="cell"><img src="svg/popcorn.svg"><span>popcorn</span></div>
  <div class="cell"><img src="svg/phone.svg"><span>phone</span></div>
  <div class="cell"><img src="svg/card.svg"><span>card</span></div>
  <div class="cell"><img src="svg/glasses.svg"><span>glasses</span></div>
</div>
<div class="light"><h2 style="font-weight:600;margin:24px 0 16px">Светлый акцент</h2>
<div class="grid">
  <div class="cell"><img src="svg/ticket.svg"><span>ticket</span></div>
  <div class="cell"><img src="svg/seat.svg"><span>seat</span></div>
  <div class="cell"><img src="svg/popcorn.svg"><span>popcorn</span></div>
  <div class="cell"><img src="svg/phone.svg"><span>phone</span></div>
  <div class="cell"><img src="svg/card.svg"><span>card</span></div>
  <div class="cell"><img src="svg/glasses.svg"><span>glasses</span></div>
</div></div>
</body></html>
