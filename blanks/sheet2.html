<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
 body{margin:0;font-family:Inter,"Segoe UI",sans-serif;background:#0B1220;color:#fff;padding:24px}
 h2{font:600 18px/1.2 Inter;margin:8px 0 14px;opacity:.8}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
 .cell{border-radius:20px;padding:8px;text-align:center}
 .dark .cell{background:radial-gradient(120% 120% at 20% 0%,#1A2E4C 0%,#0B1526 70%)}
 .light{background:#F2F7FD;color:#0F1D33;margin-top:22px;border-radius:20px;padding:18px}
 .light .cell{background:radial-gradient(120% 120% at 20% 0%,#FFFFFF 0%,#E3EDF9 70%)}
 img{width:100%;display:block}
 span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.5}
</style></head><body>
<div class="dark"><h2>Тёмный акцент</h2><div class="grid">
<div class="cell"><img src="png/ticket.png"><span>ticket</span></div>
<div class="cell"><img src="png/seat.png"><span>seat</span></div>
<div class="cell"><img src="png/popcorn.png"><span>popcorn</span></div>
<div class="cell"><img src="png/phone.png"><span>phone</span></div>
<div class="cell"><img src="png/card.png"><span>card</span></div>
<div class="cell"><img src="png/clapper.png"><span>clapper</span></div>
<div class="cell"><img src="png/glasses.png"><span>glasses</span></div>
<div class="cell"><img src="png/hero.png"><span>hero</span></div>
</div></div>
<div class="light"><h2>Светлый акцент</h2><div class="grid">
<div class="cell"><img src="png/ticket.png"><span>ticket</span></div>
<div class="cell"><img src="png/seat.png"><span>seat</span></div>
<div class="cell"><img src="png/popcorn.png"><span>popcorn</span></div>
<div class="cell"><img src="png/phone.png"><span>phone</span></div>
<div class="cell"><img src="png/card.png"><span>card</span></div>
<div class="cell"><img src="png/clapper.png"><span>clapper</span></div>
<div class="cell"><img src="png/glasses.png"><span>glasses</span></div>
<div class="cell"><img src="png/hero.png"><span>hero</span></div>
</div></div>
</body></html>
